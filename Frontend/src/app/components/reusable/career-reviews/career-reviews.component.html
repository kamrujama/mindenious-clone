<section class="career-review">
  <div class="career-wrapper">
    <h3 class="heading">Success Stories</h3>

    <div class="card-wrapper">
      <div class="slider-wrapper desktop-mode">
        @for (item of careerData; track $index) {
        <div class="item has-box-shadow">
          <div class="learner-cards">
            <div class="card-header">
              <div class="image-wrapper">
                <img alt="learner image" [src]="item.learner.image" width="50" height="50" data-loaded="true">
              </div>
              <h1 class="learner-name">{{item.learner.name}}</h1>
            </div>
            <div class="card-body">
              <p>{{item.story}}</p>
            </div>
            <div class="rating">
              @for (i of [1, 2, 3, 4, 5]; track $index) {
              <i class="fa fa-star" [class.active]="i <= item.rating"></i>
              }
            </div>
          </div>
        </div>
        }
      </div>

      <!-- Mobile Mode Slider Starts -->
      <ng-template #careerReviewRef>
        <!-- <div class="slider-wrapper"> -->
          <div class="item has-box-shadow mobile-mode">
            <div class="learner-cards">
              <div class="card-header">
                <div class="image-wrapper">
                  <img alt="learner image" [src]="careerData[currentIndex].learner.image" width="50" height="50"
                    data-loaded="true">
                </div>
                <h1 class="learner-name">{{careerData[currentIndex].learner.name}}</h1>
              </div>
              <div class="card-body">
                <p>{{careerData[currentIndex].story}}</p>
              </div>
              <div class="rating">
                @for (i of [1, 2, 3, 4, 5]; track $index) {
                <i class="fa fa-star" [class.active]="i <= careerData[currentIndex].rating"></i>
                }
              </div>
            </div>
          </div>
        <!-- </div> -->
      </ng-template>

      <div class="mobile-mode slider-wrapper">
        <app-slider [data]="careerData" [cardTemplateRef]="careerReviewRef"
          (currentIndexChange)="currentIndex = $event"></app-slider>
      </div>
        <!-- Mobile Mode Slider Ends -->

    </div>
  </div>
</section>
